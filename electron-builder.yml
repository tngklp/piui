appId: dev.piui.app
productName: PiUI
copyright: Copyright © 2026 tngklp

directories:
  output: release
  buildResources: build

asar: true

# The pi SDK loads WASM and dynamic assets at runtime, so keep it on disk
# instead of inside app.asar.
asarUnpack:
  - '**/node_modules/@earendil-works/**'
  - '**/node_modules/quickjs-wasi/**'
  - '**/node_modules/@silvia-odwyer/**'
  # node-pty ships a native addon plus ConPTY binaries that must stay on disk.
  - '**/node_modules/node-pty/**'

# Publishing to GitHub is what makes the in-app updater work: the releases feed
# is where a new version is discovered, and electron-builder uploads the
# installers plus the latest.yml metadata the updater reads.
#
# `releaseType: draft` keeps every run private until the draft is published by
# hand in the GitHub UI, which is also the moment existing installs start seeing
# it. Switch to `release` to publish the moment the build finishes.
publish:
  provider: github
  owner: tngklp
  repo: piui
  releaseType: draft

win:
  icon: build/icon.png
  target:
    # Setup: an installer with a Start-menu entry that can replace itself, which
    # is what the updater needs.
    - target: nsis
      arch: [x64]
    # Portable: a single executable for people who would rather not install. It
    # unpacks to a temporary directory, so it cannot self-update.
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Desktop GUI for the Pi coding agent
  # Only the AppImage updates itself; the updater says so for a deb install.
  artifactName: ${productName}-${version}-${arch}.${ext}
