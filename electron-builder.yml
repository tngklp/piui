appId: dev.piui.app
productName: PiUI
copyright: Copyright © 2026 tngklp

directories:
  output: release
  buildResources: build

asar: true

# node-pty ships N-API prebuilds for win32 and darwin but not linux, and N-API is
# ABI-stable across Electron versions, so on Windows the shipped prebuild is used
# as-is: rebuilding would invoke MSBuild and fail where the Spectre-mitigated
# VC++ libraries are absent. This key only exists at the top level — the schema
# rejects it under `win` — so Linux inherits it too and takes its native module
# from `npm ci`, where node-pty's own install script runs node-gyp because it has
# no Linux prebuild. The Linux job asserts that the module is there.
npmRebuild: false

# The pi SDK loads WASM and dynamic assets at runtime, so keep it on disk
# instead of inside app.asar.
asarUnpack:
  - '**/node_modules/@earendil-works/**'
  - '**/node_modules/quickjs-wasi/**'
  - '**/node_modules/@silvia-odwyer/**'
  # node-pty ships a native addon plus ConPTY binaries that must stay on disk.
  - '**/node_modules/node-pty/**'
  # Format-on-save loads Prettier's parsers dynamically; they have to be real
  # files, not entries inside app.asar.
  - '**/node_modules/prettier/**'

# `releaseType: release` publishes as soon as the build finishes, which is what
# makes an installed copy see the update. Use `draft` if you would rather review
# the artifacts before they go live.
publish:
  provider: github
  owner: tngklp
  repo: piui
  releaseType: release

win:
  icon: build/icon.png
  # Fallback name for targets without their own, e.g. the opt-in zip.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    # Setup: an installer with a Start-menu entry that can replace itself, which
    # is what the updater needs.
    - target: nsis
      arch: [x64]
    # Portable: a single executable for people who would rather not install. It
    # unpacks to a temporary directory, so it cannot self-update.
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  synopsis: Desktop GUI for the Pi coding agent
  # Uses the `desktopName` from package.json for the .desktop entry and its
  # StartupWMClass, so a running PiUI window associates with its launcher icon.
  syncDesktopName: true
  # Only the AppImage updates itself; the updater says so for a deb install.
  artifactName: ${productName}-${version}-${arch}.${ext}
