name: Release

# Releases are started by hand from the Actions tab, so a commit can never
# publish on its own. The guard job below skips the packaging work when the
# version in package.json is already released; tick "force" to rebuild a version
# whose tag exists anyway.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even if the version tag already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Decides whether this run has anything to release, so re-running an already
  # published version is a cheap no-op unless "force" is ticked.
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced, releasing v$version regardless of existing tags."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no release yet; building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows installers
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Uploads the setup .exe, the portable .exe, the no-install zip, and the
      # latest.yml the updater reads.
      - name: Package and publish
        run: npx electron-builder --win nsis portable zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux packages
    # After Windows, because both jobs upload to the same release and creating it
    # twice at once races.
    needs: [version, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      # fpm compresses the deb with xz, so the tool has to be present.
      - name: Ensure the deb toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
      # Loud failure beats a package whose terminal cannot load its native module.
      - name: Check the native terminal module
        run: test -f node_modules/node-pty/build/Release/pty.node
      - name: Build
        run: npm run build
      # node-pty has no Linux prebuild, so its module has to be compiled, which
      # is what `npm ci` did above.
      - name: Package and publish
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
